<template lwc:render-mode="light">
    <div class="kr-page">
        <!-- ═══ PAGE HEADER ═══ -->
        <header class="kr-header">
            <div class="kr-header__main">
                <div class="kr-header__icon-wrapper" aria-hidden="true">
                    <lightning-icon
                        icon-name="standard:knowledge"
                        size="medium"
                        alternative-text="Knowledge Article"
                    ></lightning-icon>
                </div>
                <div class="kr-header__title-block">
                    <p class="kr-header__overline">{overline}</p>
                    <h1 class="kr-header__title" title={title}>{title}</h1>
                </div>
            </div>
            <div class="kr-header__actions">
                <lightning-button
                    variant="neutral"
                    label="Follow"
                    icon-name="utility:add"
                    icon-position="left"
                    class="kr-header__btn kr-header__btn--pill"
                ></lightning-button>
                <lightning-button
                    variant="neutral"
                    label="Archive"
                    class="kr-header__btn"
                ></lightning-button>
                <lightning-button
                    variant="neutral"
                    label="Submit for Translation"
                    class="kr-header__btn"
                ></lightning-button>
                <lightning-button
                    variant="brand-outline"
                    label="Analyse Article"
                    class="kr-header__btn"
                ></lightning-button>
                <lightning-button-icon
                    variant="border-filled"
                    icon-name="utility:down"
                    alternative-text="More actions"
                    class="kr-header__more"
                ></lightning-button-icon>
            </div>
        </header>

        <!-- ═══ METADATA STRIP ═══
             Full label text is rendered (e.g. "Article number"); the
             column-grid + ellipsis CSS clips them visually to match
             the truncated look in the Figma frame at narrow widths. -->
        <section class="kr-meta" aria-label="Article metadata">
            <div class="kr-meta__item">
                <p class="kr-meta__label">Article number</p>
                <p class="kr-meta__value">{articleNumber}</p>
            </div>
            <div class="kr-meta__item">
                <p class="kr-meta__label">Article Record Type</p>
                <p class="kr-meta__value">{articleRecordType}</p>
            </div>
            <div class="kr-meta__item">
                <p class="kr-meta__label">Version Number</p>
                <p class="kr-meta__value">{versionNumber}</p>
            </div>
            <div class="kr-meta__item">
                <p class="kr-meta__label">Is Latest Version</p>
                <p class="kr-meta__value">
                    <!-- Checked-state visual built from a small flex
                         square + white check glyph (avoids needing a
                         full <lightning-input type="checkbox">). -->
                    <span class="kr-meta__check" role="img" aria-label="Yes">
                        <lightning-icon
                            icon-name="utility:check"
                            size="xx-small"
                            alternative-text=""
                        ></lightning-icon>
                    </span>
                </p>
            </div>
            <div class="kr-meta__item">
                <p class="kr-meta__label">Publication Status</p>
                <p class="kr-meta__value">{publishedStatus}</p>
            </div>
            <div class="kr-meta__item">
                <p class="kr-meta__label">Language</p>
                <p class="kr-meta__value">{language}</p>
            </div>
            <div class="kr-meta__item">
                <p class="kr-meta__label">Parent Article</p>
                <p class="kr-meta__value">
                    <a class="kr-meta__link" href="javascript:void(0)">{parentArticleId}</a>
                </p>
            </div>
        </section>

        <!-- ═══ BODY: Left main + Right sidebar ═══ -->
        <div class="kr-body">
            <!-- LEFT MAIN COLUMN
                 Wrapped in lightning-card so the surface, border, and
                 shadow come from the Lightning Base Component instead
                 of hand-rolled CSS. The inner `.kr-main__body` keeps
                 the vertical flex/gap layout for tabs + tab content. -->
            <lightning-card class="kr-main">
                <div class="kr-main__body">
                <!-- Tab bar -->
                <div class="kr-tabs" role="tablist" aria-label="Article views">
                    <template for:each={tabs} for:item="tab">
                        <button
                            key={tab.id}
                            type="button"
                            role="tab"
                            aria-selected={tab.ariaSelected}
                            data-id={tab.id}
                            class={tab.tabClass}
                            onclick={handleTabClick}
                        >{tab.label}</button>
                    </template>
                </div>

                <!-- ════════ DETAILS TAB CONTENT ═══════════════════════
                     Figma frame 182:35015 shows Information + Details
                     accordions when the Details tab is active. -->
                <template lwc:if={isDetailsTab}>
                <!-- Information section (collapsible) -->
                <section class="kr-section">
                    <button
                        type="button"
                        class="kr-section__header"
                        aria-expanded={_infoOpen}
                        onclick={handleToggleInfo}
                    >
                        <lightning-icon
                            icon-name={infoChevron}
                            size="x-small"
                            alternative-text="Toggle Information"
                            class="kr-section__chevron"
                        ></lightning-icon>
                        <span class="kr-section__title">Information</span>
                    </button>
                    <template lwc:if={_infoOpen}>
                        <div class="kr-section__body">
                            <div class="kr-field">
                                <p class="kr-field__label">Title</p>
                                <p class="kr-field__value kr-field__value--muted">{title}</p>
                            </div>
                            <div class="kr-field">
                                <p class="kr-field__label">
                                    <span>Summary</span>
                                    <lightning-icon
                                        icon-name="utility:info"
                                        size="xx-small"
                                        alternative-text="Info"
                                        class="kr-field__info"
                                    ></lightning-icon>
                                </p>
                                <p class="kr-field__value">{summary}</p>
                            </div>
                        </div>
                    </template>
                </section>

                <!-- Details section (collapsible) -->
                <section class="kr-section">
                    <button
                        type="button"
                        class="kr-section__header"
                        aria-expanded={_detailsOpen}
                        onclick={handleToggleDetails}
                    >
                        <lightning-icon
                            icon-name={detailsChevron}
                            size="x-small"
                            alternative-text="Toggle Details"
                            class="kr-section__chevron"
                        ></lightning-icon>
                        <span class="kr-section__title">Details</span>
                    </button>
                    <template lwc:if={_detailsOpen}>
                        <div class="kr-section__body">
                            <div class="kr-field kr-field--rich">
                                <p class="kr-field__label">
                                    <span>Details</span>
                                    <lightning-icon
                                        icon-name="utility:info"
                                        size="xx-small"
                                        alternative-text="Info"
                                        class="kr-field__info"
                                    ></lightning-icon>
                                </p>
                                <div class="kr-rich">
                                    <template lwc:if={hasEditedBody}>
                                        <!-- When the user has saved an
                                             edit in the Review Article
                                             experience, render the
                                             editor's HTML directly so
                                             formatting and any block
                                             types unique to the editor
                                             (lists, blockquotes, etc.)
                                             show up here untouched. -->
                                        <lightning-formatted-rich-text
                                            value={bodyHtml}
                                        ></lightning-formatted-rich-text>
                                    </template>
                                    <template lwc:else>
                                        <template for:each={bodyBlocks} for:item="b">
                                            <p key={b.key} lwc:if={b.isLead}><strong>{b.text}</strong></p>
                                            <p key={b.key} lwc:elseif={b.isSubheading} class="kr-rich__region"><strong>{b.text}</strong></p>
                                            <p key={b.key} lwc:elseif={b.isMinor} class="kr-rich__country">{b.text}</p>
                                            <p key={b.key} lwc:elseif={b.isParagraph}>{b.text}</p>
                                            <ul key={b.key} lwc:elseif={b.isList}>
                                                <template for:each={b.items} for:item="i">
                                                    <li key={i.key}>{i.text}</li>
                                                </template>
                                            </ul>
                                        </template>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </section>
                </template>

                <!-- ════════ ANALYSIS TAB CONTENT ══════════════════════
                     Figma frame 182:34320 — AI Readiness dashboard
                     (donut + KPIs + summary + suggestion button) plus
                     a Structural Violations data table. Built without
                     a chart library: the donut is two stacked SVG
                     arcs driven by `readinessPercent`. -->
                <template lwc:if={isAnalysisTab}>
                    <section class="kr-ai" aria-labelledby="kr-ai-title">
                        <header class="kr-ai__header">
                            <h2 id="kr-ai-title" class="kr-ai__title">AI Readiness Score</h2>
                        </header>
                        <div class="kr-ai__body">
                            <!-- Donut: green arc on grey ring -->
                            <div class="kr-donut" role="img" aria-label={readinessLabel} style={readinessDonutStyle}>
                                <svg class="kr-donut__svg" viewBox="0 0 120 120" aria-hidden="true">
                                    <!-- Background ring (grey) -->
                                    <circle class="kr-donut__track" cx="60" cy="60" r="52"></circle>
                                    <!-- Foreground arc (green); stroke-dasharray
                                         is sized off the percentage so a score
                                         change reflows without JS. -->
                                    <circle class="kr-donut__arc" cx="60" cy="60" r="52"
                                            stroke-dasharray="254.469 326.726"
                                            transform="rotate(-90 60 60)"></circle>
                                </svg>
                                <span class="kr-donut__label">{readinessLabel}</span>
                            </div>

                            <!-- KPI rows + summary + CTA -->
                            <div class="kr-ai__right">
                                <div class="kr-kpi">
                                    <div class="kr-kpi__row">
                                        <span class="kr-kpi__label">Metadata Completeness:</span>
                                        <span class="kr-kpi__value">{metadataCompleteness}</span>
                                        <lightning-badge
                                            label="Trending Average"
                                            class="slds-theme_warning kr-kpi__badge"
                                        ></lightning-badge>
                                    </div>
                                    <div class="kr-kpi__row">
                                        <span class="kr-kpi__label">Structural Violations:</span>
                                        <span class="kr-kpi__value">{structuralViolationsCount}</span>
                                        <lightning-badge
                                            label="Trending below baseline"
                                            class="kr-kpi__badge kr-kpi__badge--error"
                                        ></lightning-badge>
                                    </div>
                                </div>
                                <div class="kr-ai__summary">{readinessSummary}</div>
                            </div>
                        </div>
                    </section>

                    <!-- ════════ STRUCTURAL VIOLATIONS ══════════════════
                         Figma frames 612:43216 (collapsed tiles) and
                         612:70638 (expanded tile). Each tile is an
                         expandable row: chevron + title + badges + a
                         neutral "Edit to Resolve" pill. Expanding reveals
                         a lavender detail panel listing each finding with
                         its coverage / confidence lift. -->
                    <section class="kr-sv" aria-labelledby="kr-sv-title">
                        <header class="kr-sv__header">
                            <div class="kr-sv__heading">
                                <h2 id="kr-sv-title" class="kr-sv__title">Top Structural Violations to Resolve</h2>
                                <p class="kr-sv__subtitle">Unified view of decisions, expertise, and organizational knowledge</p>
                            </div>
                            <lightning-button-group class="kr-sv__actions">
                                <lightning-button
                                    label="Review in Queue"
                                    onclick={handleReviewInQueue}
                                ></lightning-button>
                                <lightning-button
                                    label="Approve All"
                                    onclick={handleApproveAll}
                                ></lightning-button>
                            </lightning-button-group>
                        </header>

                        <ul class="kr-sv__list">
                            <template for:each={structuralViolationTiles} for:item="tile">
                                <li key={tile.id} class={tile.tileClass}>
                                    <div class="kr-sv-tile__main">
                                        <button
                                            type="button"
                                            class="kr-sv-tile__chevron"
                                            aria-expanded={tile.expanded}
                                            aria-label="Toggle violations"
                                            data-id={tile.id}
                                            onclick={handleToggleViolation}
                                        >
                                            <lightning-icon
                                                icon-name={tile.chevron}
                                                size="x-small"
                                                alternative-text="Toggle"
                                            ></lightning-icon>
                                        </button>
                                        <div class="kr-sv-tile__content">
                                            <div class="kr-sv-tile__titlerow">
                                                <span class="kr-sv-tile__title">{tile.title}</span>
                                                <span class="kr-sv-badge kr-sv-badge--violations">{tile.violationsLabel}</span>
                                                <span class="kr-sv-badge kr-sv-badge--score">
                                                    <lightning-icon
                                                        icon-name="utility:arrowup"
                                                        size="xx-small"
                                                        class="kr-sv-badge__icon"
                                                        alternative-text="Up"
                                                    ></lightning-icon>
                                                    <span>{tile.aiScoreLabel}</span>
                                                </span>
                                            </div>
                                            <p class="kr-sv-tile__desc">{tile.description}</p>
                                        </div>
                                        <lightning-button
                                            class="kr-sv-tile__cta"
                                            variant="neutral"
                                            label="Edit to Resolve"
                                            data-id={tile.id}
                                            onclick={handleEditToResolve}
                                        ></lightning-button>
                                    </div>

                                    <template lwc:if={tile.expanded}>
                                        <div class="kr-sv-tile__details">
                                            <template for:each={tile.details} for:item="d">
                                                <div key={d.id} class="kr-sv-detail">
                                                    <div class="kr-sv-detail__info">
                                                        <lightning-icon
                                                            icon-name={d.icon}
                                                            size="x-small"
                                                            class={d.iconClass}
                                                            alternative-text=""
                                                        ></lightning-icon>
                                                        <div class="kr-sv-detail__text">
                                                            <span class="kr-sv-detail__title">{d.title}</span>
                                                            <span class="kr-sv-detail__desc">{d.desc}</span>
                                                        </div>
                                                    </div>
                                                    <div class="kr-sv-detail__stats">
                                                        <div class="kr-sv-detail__stat">
                                                            <span class="kr-sv-detail__stat-value">{d.coverage}</span>
                                                            <span class="kr-sv-detail__stat-label">{d.coverageLabel}</span>
                                                        </div>
                                                        <div class="kr-sv-detail__stat">
                                                            <span class="kr-sv-detail__stat-value">{d.confidence}</span>
                                                            <span class="kr-sv-detail__stat-label">{d.confidenceLabel}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </li>
                            </template>
                        </ul>
                    </section>

                    <!-- ════════ TOP QUALITY ISSUES ═════════════════════
                         Figma frame 612:71226. Each card shows a
                         contradiction / similarity finding with a type
                         badge, a confidence badge, a lavender summary
                         panel, and two source-article columns each ending
                         in an "Archive Article" action. The similarity
                         card additionally offers "Merge Articles". -->
                    <section class="kr-qi" aria-labelledby="kr-qi-title">
                        <header class="kr-qi__header">
                            <div class="kr-qi__heading">
                                <h2 id="kr-qi-title" class="kr-qi__title">Top Quality Issues to Resolve</h2>
                                <p class="kr-qi__subtitle">Unified view of decisions, expertise, and organizational knowledge</p>
                            </div>
                            <a href="javascript:void(0)" class="kr-qi__viewall" onclick={handleViewAllQuality}>View All</a>
                        </header>

                        <ul class="kr-qi__list">
                            <template for:each={qualityIssues} for:item="issue">
                                <li key={issue.id} class="kr-qi-card">
                                    <div class="kr-qi-card__head">
                                        <div class="kr-qi-card__titlerow">
                                            <span class="kr-qi-card__title">{issue.title}</span>
                                            <span class="kr-qi-badge kr-qi-badge--type">{issue.typeBadge}</span>
                                            <span class="kr-qi-badge kr-qi-badge--confidence">{issue.confidence}</span>
                                        </div>
                                        <div class="kr-qi-card__actions">
                                            <lightning-button
                                                variant="neutral"
                                                label="Ignore Issue"
                                                class="kr-qi-card__btn"
                                                data-id={issue.id}
                                                onclick={handleIgnoreIssue}
                                            ></lightning-button>
                                            <template lwc:if={issue.showMerge}>
                                                <lightning-button
                                                    variant="brand"
                                                    label="Merge Articles"
                                                    class="kr-qi-card__btn"
                                                    data-id={issue.id}
                                                    onclick={handleMergeArticles}
                                                ></lightning-button>
                                            </template>
                                        </div>
                                    </div>

                                    <div class="kr-qi-card__summary">
                                        <span class="kr-qi-card__summary-title">{issue.summaryTitle}</span>
                                        <p class="kr-qi-card__summary-text">{issue.summary}</p>
                                    </div>

                                    <div class="kr-qi-card__cols">
                                        <div class="kr-qi-col">
                                            <span class="kr-qi-col__label">{issue.leftLabel}</span>
                                            <a href="javascript:void(0)" class="kr-qi-col__link">
                                                <lightning-icon
                                                    icon-name="utility:knowledge_base"
                                                    size="xx-small"
                                                    class="kr-qi-col__link-icon"
                                                    alternative-text=""
                                                ></lightning-icon>
                                                <span>{issue.leftArticle}</span>
                                            </a>
                                            <p class="kr-qi-col__text">{issue.leftText}</p>
                                            <div class="kr-qi-col__divider"></div>
                                            <lightning-button
                                                variant="neutral"
                                                label="Archive Article"
                                                class="kr-qi-col__btn"
                                                data-id={issue.id}
                                                data-side="left"
                                                onclick={handleArchiveArticle}
                                            ></lightning-button>
                                        </div>
                                        <div class="kr-qi-col">
                                            <span class="kr-qi-col__label">{issue.rightLabel}</span>
                                            <a href="javascript:void(0)" class="kr-qi-col__link">
                                                <lightning-icon
                                                    icon-name="utility:knowledge_base"
                                                    size="xx-small"
                                                    class="kr-qi-col__link-icon"
                                                    alternative-text=""
                                                ></lightning-icon>
                                                <span>{issue.rightArticle}</span>
                                            </a>
                                            <p class="kr-qi-col__text">{issue.rightText}</p>
                                            <div class="kr-qi-col__divider"></div>
                                            <lightning-button
                                                variant="neutral"
                                                label="Archive Article"
                                                class="kr-qi-col__btn"
                                                data-id={issue.id}
                                                data-side="right"
                                                onclick={handleArchiveArticle}
                                            ></lightning-button>
                                        </div>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </section>
                </template>
                </div>
            </lightning-card>

            <!-- RIGHT SIDEBAR
                 Each sidebar card is a `<lightning-card>` so it picks up
                 the LBC's standard surface, border, and shadow. The
                 collapse chevron lives in the `actions` slot and the
                 list/CTA content goes in the default body slot. -->
            <aside class="kr-sidebar" aria-label="Article context">
                <!-- Table of Content card -->
                <lightning-card class="kr-card" title="Table of Content">
                    <button
                        type="button"
                        slot="actions"
                        class="kr-card__toggle"
                        aria-expanded={_tocOpen}
                        aria-label="Toggle Table of Content"
                        onclick={handleToggleToc}
                    >
                        <lightning-icon
                            icon-name={tocChevron}
                            size="x-small"
                            alternative-text="Toggle"
                        ></lightning-icon>
                    </button>
                    <template lwc:if={_tocOpen}>
                        <ul class="kr-toc">
                            <template for:each={tocItems} for:item="t">
                                <li key={t.id} class={t.itemClass}>
                                    <lightning-icon
                                        icon-name={t.chevron}
                                        size="xx-small"
                                        alternative-text=""
                                        class={t.iconClass}
                                    ></lightning-icon>
                                    <a href="javascript:void(0)" class="kr-toc__link">{t.label}</a>
                                </li>
                            </template>
                        </ul>
                    </template>
                </lightning-card>

                <!-- Helpful? card -->
                <lightning-card class="kr-card" title="Was this article helpful?">
                    <div class="kr-helpful">
                        <lightning-button
                            variant={likeBtnVariant}
                            label="Like"
                            icon-name="utility:like"
                            icon-position="left"
                            onclick={handleLike}
                            class="kr-helpful__btn"
                        ></lightning-button>
                        <lightning-button
                            variant={dislikeBtnVariant}
                            label="Dislike"
                            icon-name="utility:dislike"
                            icon-position="left"
                            onclick={handleDislike}
                            class="kr-helpful__btn"
                        ></lightning-button>
                    </div>
                </lightning-card>

                <!-- Categories card -->
                <lightning-card class="kr-card" title="Categories(1)">
                    <button
                        type="button"
                        slot="actions"
                        class="kr-card__toggle"
                        aria-expanded={_categoriesOpen}
                        aria-label="Toggle Categories"
                        onclick={handleToggleCategories}
                    >
                        <lightning-icon
                            icon-name={categoriesChevron}
                            size="x-small"
                            alternative-text="Toggle"
                        ></lightning-icon>
                    </button>
                    <template lwc:if={_categoriesOpen}>
                        <ul class="kr-toc">
                            <li class="kr-toc__item">
                                <button
                                    type="button"
                                    class="kr-toc__expander"
                                    aria-expanded={_inquiryOpen}
                                    onclick={handleToggleInquiry}
                                >
                                    <lightning-icon
                                        icon-name={inquiryChevron}
                                        size="xx-small"
                                        alternative-text="Toggle Inquiry"
                                        class="kr-toc__chevron"
                                    ></lightning-icon>
                                    <span class="kr-toc__link">Inquiry Type(1)</span>
                                </button>
                            </li>
                        </ul>
                    </template>
                </lightning-card>
            </aside>
        </div>

    </div>
</template>
