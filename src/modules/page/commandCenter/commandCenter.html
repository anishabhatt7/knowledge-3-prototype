<template lwc:render-mode="light">
    <div class="cc-page">
        <!-- ═══ LEFT RAIL ═══ -->
        <nav class={railClass} aria-label="Knowledge navigation">
            <div class="kh-rail__top">
                <template for:each={railTopItems} for:item="item">
                    <button
                        key={item.id}
                        type="button"
                        class={item.rowClass}
                        data-id={item.id}
                        onclick={handleRailNav}
                    >
                        <lightning-icon
                            icon-name={item.icon}
                            size="x-small"
                            alternative-text={item.label}
                            class="kh-rail__icon"
                        ></lightning-icon>
                        <span class="kh-rail__label">{item.label}</span>
                    </button>
                </template>

                <div class="kh-rail__divider" role="separator"></div>
                <div class="kh-rail__group-header">Maintain</div>
                <template for:each={railMaintainComputed} for:item="item">
                    <button
                        key={item.id}
                        type="button"
                        class={item.rowClass}
                        data-id={item.id}
                        onclick={handleRailNav}
                    >
                        <lightning-icon
                            icon-name={item.icon}
                            size="x-small"
                            alternative-text={item.label}
                            class="kh-rail__icon"
                        ></lightning-icon>
                        <span class="kh-rail__label">{item.label}</span>
                    </button>
                </template>

                <div class="kh-rail__divider" role="separator"></div>
                <div class="kh-rail__group-header">Create</div>
                <template for:each={railCreate} for:item="item">
                    <button
                        key={item.id}
                        type="button"
                        class="kh-rail__row"
                        data-id={item.id}
                        onclick={handleRailNav}
                    >
                        <lightning-icon
                            icon-name={item.icon}
                            size="x-small"
                            alternative-text={item.label}
                            class="kh-rail__icon"
                        ></lightning-icon>
                        <span class="kh-rail__label">{item.label}</span>
                    </button>
                </template>
            </div>

            <div class="kh-rail__bottom">
                <button
                    type="button"
                    class="kh-rail__row kh-rail__row--collapse"
                    aria-label={collapseAriaLabel}
                    onclick={handleToggleRail}
                >
                    <lightning-icon
                        icon-name={collapseIconName}
                        size="x-small"
                        alternative-text={collapseAriaLabel}
                        class="kh-rail__icon"
                    ></lightning-icon>
                    <span class="kh-rail__label">Collapse</span>
                </button>
            </div>
        </nav>

        <!-- ═══ MAIN CONTENT ═══ -->
        <main class="cc-main">
            <!-- Page header (Figma 214:32880 / "Knowledge Health") -->
            <section class="cc-section cc-section--header">
                <div class="cc-header">
                    <div class="cc-header__left">
                        <lightning-icon
                            icon-name="standard:lightning_usage"
                            size="medium"
                            alternative-text="Knowledge Health"
                            class="cc-header__icon"
                        ></lightning-icon>
                        <div class="cc-header__text">
                            <h1 class="cc-header__title">Knowledge Health</h1>
                            <p class="cc-header__subtitle">Unified view of decisions, expertise, and organizational knowledge</p>
                        </div>
                    </div>
                    <div class="cc-header__search">
                        <lightning-input
                            type="search"
                            placeholder="Search…"
                            variant="label-hidden"
                            label="Search"
                        ></lightning-input>
                    </div>
                </div>
            </section>

            <!-- Two-card overview row: AI Readiness + Total Articles -->
            <section class="cc-section">
                <div class="cc-overview-row">
                    <!-- Knowledge AI Readiness -->
                    <article class="cc-readiness-card">
                        <h2 class="cc-readiness-card__title">Knowledge AI Readiness</h2>
                        <div class="cc-donut-wrapper">
                            <svg class="cc-donut-svg" viewBox="0 0 160 160">
                                <circle
                                    class="cc-donut-bg"
                                    cx="80"
                                    cy="80"
                                    r="70"
                                    fill="none"
                                    stroke-width="14"
                                ></circle>
                                <circle
                                    class="cc-donut-fg"
                                    cx="80"
                                    cy="80"
                                    r="70"
                                    fill="none"
                                    stroke-width="14"
                                    stroke-dasharray={donutDasharray}
                                    stroke-dashoffset={donutDashoffset}
                                    stroke-linecap="round"
                                ></circle>
                            </svg>
                            <div class="cc-donut-label">
                                <span class="cc-donut-label__value">{readinessOverall}</span>
                            </div>
                        </div>
                        <p class="cc-readiness-card__copy">
                            Completeness and clarity are above target, but duplication risk is dragging the score. Resolve the flagged articles to push readiness past 85%.
                        </p>
                        <lightning-button
                            variant="brand-outline"
                            label="Review Suggestions"
                            class="cc-readiness-card__cta"
                        ></lightning-button>
                    </article>

                    <!-- Total Articles -->
                    <article class="cc-articles-card">
                        <header class="cc-articles-card__head">
                            <h2 class="cc-articles-card__title">Total Articles</h2>
                        </header>
                        <div class="cc-articles-card__metric-row">
                            <span class="cc-articles-card__value">{totalArticlesValue}</span>
                            <lightning-badge
                                class="cc-articles-card__badge"
                                label={totalArticlesBadge}
                            ></lightning-badge>
                        </div>
                        <div class="cc-articles-card__delta">
                            <span class="cc-articles-card__delta-value">{totalArticlesDelta}</span>
                            <span class="cc-articles-card__delta-label">{totalArticlesPeriod}</span>
                        </div>
                        <div class="cc-articles-card__chart" aria-hidden="true">
                            <div class="cc-spark-y-axis">
                                <span class="cc-spark-y-axis__label">##</span>
                                <span class="cc-spark-y-axis__rule"></span>
                                <span class="cc-spark-y-axis__label">##</span>
                            </div>
                            <div class="cc-spark-plot">
                                <svg class="cc-spark-svg" viewBox="0 0 480 110" preserveAspectRatio="none">
                                    <defs>
                                        <linearGradient id="cc-spark-grad" x1="0" y1="0" x2="0" y2="1">
                                            <stop offset="0%" stop-color="#066afe" stop-opacity="0.18"></stop>
                                            <stop offset="100%" stop-color="#066afe" stop-opacity="0"></stop>
                                        </linearGradient>
                                    </defs>
                                    <line class="cc-spark-goal" x1="0" y1={sparkGoalY} x2="480" y2={sparkGoalY}></line>
                                    <path class="cc-spark-forecast" d={sparkForecastPath}></path>
                                    <path class="cc-spark-line" d={sparkPath}></path>
                                    <path class="cc-spark-line cc-spark-line--projected" d={sparkProjectedPath}></path>
                                </svg>
                                <span class="cc-spark-goal-label" aria-hidden="true">Goal</span>
                            </div>
                            <div class="cc-spark-x-axis">
                                <span class="cc-spark-x-axis__rule"></span>
                                <div class="cc-spark-x-axis__labels">
                                    <span>##</span>
                                    <span>##</span>
                                </div>
                            </div>
                        </div>
                    </article>
                </div>
            </section>

            <!-- Top Structural Violations to Resolve (Figma 612-43216) -->
            <section class="cc-section">
                <div class="cc-violations">
                    <header class="cc-violations__header">
                        <div class="cc-violations__heading">
                            <h2 class="cc-violations__title">Top Structural Violations to Resolve</h2>
                            <p class="cc-violations__subtitle">Unified view of decisions, expertise, and organizational knowledge</p>
                        </div>
                        <div class="cc-violations__actions slds-button-group" role="group">
                            <button
                                type="button"
                                class="slds-button slds-button_outline-brand cc-violations__action cc-violations__action--left"
                                onclick={handleReviewInQueue}
                            >Review in Queue</button>
                            <button
                                type="button"
                                class="slds-button slds-button_outline-brand cc-violations__action cc-violations__action--right"
                                onclick={handleApproveAll}
                            >Approve All</button>
                        </div>
                    </header>

                    <ul class="cc-sv">
                        <template for:each={violationsComputed} for:item="v">
                            <li key={v.id} class={v.tileClass}>
                                <div class="cc-sv__head">
                                    <div class="cc-sv__head-text">
                                        <button
                                            type="button"
                                            class="cc-sv__summary"
                                            data-id={v.id}
                                            aria-expanded={v.expanded}
                                            onclick={handleToggleViolation}
                                        >
                                            <lightning-icon
                                                icon-name={v.chevronIcon}
                                                size="x-small"
                                                alternative-text="Toggle details"
                                                class="cc-sv__chevron"
                                            ></lightning-icon>
                                            <span class="cc-sv__title">{v.article}</span>
                                            <span class="cc-sv__badge cc-sv__badge--violations">{v.violationsLabel}</span>
                                            <span class="cc-sv__badge cc-sv__badge--score">
                                                <lightning-icon
                                                    icon-name="utility:arrowup"
                                                    size="xx-small"
                                                    alternative-text="Up"
                                                    class="cc-sv__badge-icon"
                                                ></lightning-icon>
                                                <span>{v.aiScoreLabel}</span>
                                            </span>
                                        </button>
                                        <p class="cc-sv__desc">{v.description}</p>
                                    </div>
                                    <button
                                        type="button"
                                        class="slds-button slds-button_neutral cc-sv__resolve"
                                        data-id={v.id}
                                        onclick={handleEditToResolve}
                                    >Edit to Resolve</button>
                                </div>

                                <template lwc:if={v.expanded}>
                                    <div class="cc-sv__issues">
                                        <template for:each={v.issues} for:item="issue">
                                            <div key={issue.id} class="cc-sv__issue">
                                                <div class="cc-sv__issue-main">
                                                    <lightning-icon
                                                        icon-name={issue.iconName}
                                                        size="x-small"
                                                        alternative-text=""
                                                        class={issue.iconClass}
                                                    ></lightning-icon>
                                                    <div class="cc-sv__issue-text">
                                                        <span class="cc-sv__issue-title">{issue.title}</span>
                                                        <span class="cc-sv__issue-subtitle">{issue.subtitle}</span>
                                                    </div>
                                                </div>
                                                <div class="cc-sv__issue-metrics">
                                                    <div class="cc-sv__metric">
                                                        <span class="cc-sv__metric-value">{issue.coverageDelta}</span>
                                                        <span class="cc-sv__metric-label">Increase in Coverage</span>
                                                    </div>
                                                    <div class="cc-sv__metric">
                                                        <span class="cc-sv__metric-value">{issue.confidenceDelta}</span>
                                                        <span class="cc-sv__metric-label">AI confidence</span>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </li>
                        </template>
                    </ul>
                </div>
            </section>

            <!-- Top Quality Issues to Resolve (Figma 612-71226) -->
            <section class="cc-section">
                <div class="cc-quality">
                    <header class="cc-quality__header">
                        <div class="cc-quality__heading">
                            <h2 class="cc-quality__title">Top Quality Issues to Resolve</h2>
                            <p class="cc-quality__subtitle">Unified view of decisions, expertise, and organizational knowledge</p>
                        </div>
                        <a href="javascript:void(0);" class="cc-quality__view-all">View All</a>
                    </header>

                    <template for:each={qualityIssuesComputed} for:item="q">
                        <article key={q.id} class="cc-qi">
                            <header class="cc-qi__head">
                                <h3 class="cc-qi__title">{q.title}</h3>
                                <span class="cc-qi__type">{q.typeLabel}</span>
                                <span class="cc-qi__confidence">Confidence: {q.confidence}</span>
                                <div class="cc-qi__actions">
                                    <button
                                        type="button"
                                        class="slds-button slds-button_neutral cc-qi__action"
                                        data-id={q.id}
                                        onclick={handleIgnoreQualityIssue}
                                    >Ignore Issue</button>
                                    <template lwc:if={q.showMerge}>
                                        <button
                                            type="button"
                                            class="slds-button slds-button_brand cc-qi__action"
                                            data-id={q.id}
                                            onclick={handleMergeArticles}
                                        >Merge Articles</button>
                                    </template>
                                </div>
                            </header>

                            <p class="cc-qi__summary">{q.description}</p>

                            <div class="cc-qi__columns">
                                <template for:each={q.columns} for:item="col">
                                    <div key={col.articleId} class="cc-qi__col">
                                        <span class="cc-qi__col-label">{col.label}</span>
                                        <a
                                            href="javascript:void(0);"
                                            class="cc-qi__col-link"
                                            data-id={col.articleId}
                                            data-title={col.articleTitle}
                                            onclick={handleQualityArticleOpen}
                                        >
                                            <lightning-icon
                                                icon-name="utility:knowledge_base"
                                                size="xx-small"
                                                alternative-text="Article"
                                                class="cc-qi__col-link-icon"
                                            ></lightning-icon>
                                            <span>{col.articleTitle}</span>
                                        </a>
                                        <p class="cc-qi__col-text">{col.text}</p>
                                        <button
                                            type="button"
                                            class="slds-button slds-button_neutral cc-qi__archive"
                                            data-id={q.id}
                                            onclick={handleArchiveArticle}
                                        >Archive Article</button>
                                    </div>
                                </template>
                            </div>
                        </article>
                    </template>
                </div>
            </section>
        </main>
    </div>
</template>
